<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="rprompt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D5BFF"/>
      <stop offset="0.55" stop-color="#4D6BFF"/>
      <stop offset="1" stop-color="#2BB7FF"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <g stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- prompt chevron ">" -->
    <path d="M150 206 L206 256 L150 306"/>
    <!-- fan-out routes to engine nodes -->
    <path d="M276 256 C330 256 348 154 392 154" opacity="0.92"/>
    <path d="M276 256 H392" opacity="0.92"/>
    <path d="M276 256 C330 256 348 358 392 358" opacity="0.92"/>
  </g>

  <!-- terminal underscore "_" -->
  <rect x="150" y="330" width="74" height="22" rx="11" fill="#FFFFFF"/>

  <!-- hub (proxy core) + engine nodes -->
  <g fill="#FFFFFF">
    <circle cx="276" cy="256" r="30"/>
    <circle cx="392" cy="154" r="26"/>
    <circle cx="392" cy="256" r="26"/>
    <circle cx="392" cy="358" r="26"/>
  </g>
</svg>
